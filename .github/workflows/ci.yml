# Runs PN's checks on every pull request and on main. The site's production build isn't here:
# Vercel builds every pull request as a preview, and a failed preview is the build check.
# The plan-quality and unstick evals aren't here either: they cost money and only matter when a
# prompt or model changes (see apps/site/evals/*/README.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: "@pn/core tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run core:test

  database:
    name: Migration tests (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: supabase/v2/package-lock.json
      - run: npm ci --prefix supabase/v2
      - run: npm run db:test

  site:
    name: Site tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci --prefix apps/site
      - run: npm run site:test

  app:
    name: App type check and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/app/package-lock.json
      - run: npm ci --prefix apps/app
      # expo-env.d.ts is gitignored (Expo writes it on `expo start`); the type check needs it.
      - run: echo '/// <reference types="expo/types" />' > apps/app/expo-env.d.ts
      - run: npx tsc --noEmit
        working-directory: apps/app
      - run: npx expo lint
        working-directory: apps/app
